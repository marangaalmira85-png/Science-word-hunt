<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Science Word Hunt!</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: #38334d;

    background:
        radial-gradient(circle at 10% 10%, #fff3a6 0 45px, transparent 46px),
        radial-gradient(circle at 90% 15%, #ffc9e8 0 55px, transparent 56px),
        radial-gradient(circle at 15% 90%, #bcecff 0 60px, transparent 61px),
        linear-gradient(135deg, #ded8ff, #fbdcf0, #d7f5ff);

    min-height: 100vh;
}

/* HEADER */

header {
    text-align: center;
    padding: 25px 15px 10px;
}

.title {
    display: inline-block;

    background: white;

    padding: 12px 25px;

    border-radius: 25px;

    box-shadow: 0 7px 0 #aaa1dc;

    transform: rotate(-1deg);
}

.title h1 {
    margin: 0;

    font-family: 'Baloo 2', cursive;

    font-size: clamp(34px, 7vw, 62px);

    line-height: 1;
}

.yellow {
    color: #efa900;
}

.pink {
    color: #ed649f;
}

.purple {
    color: #7164d5;
}

.subtitle {
    max-width: 750px;

    margin: 20px auto;

    padding: 14px 20px;

    background: white;

    border-radius: 20px;

    font-weight: 600;

    box-shadow: 0 5px 18px #645b9130;
}


/* SCORE */

.score-box {
    position: fixed;

    top: 15px;
    right: 15px;

    z-index: 20;

    background: white;

    padding: 10px 18px;

    border-radius: 18px;

    box-shadow: 0 5px 0 #aaa1dc;

    font-weight: 800;
}

.score-box span {
    color: #f0ae17;
    font-size: 23px;
}


/* MAIN */

.container {
    width: min(1000px, 94%);

    margin: auto;
}

.card {
    background: rgba(255,255,255,.88);

    border: 3px solid white;

    border-radius: 30px;

    padding: 25px;

    margin: 20px 0;

    box-shadow: 0 12px 30px #62598725;
}


/* PROGRESS */

.progress-area {
    text-align: center;
}

.progress-text {
    font-weight: 800;

    color: #7164d5;

    font-size: 18px;
}

.progress-bar {
    height: 14px;

    background: #e8e3f8;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 8px;
}

.progress-fill {
    height: 100%;

    width: 0%;

    background: linear-gradient(
        90deg,
        #8a7de0,
        #ef78ad,
        #f5c95d
    );

    transition: .4s;
}


/* QUESTION */

.question-box {
    background: #fff8cf;

    border-radius: 22px;

    padding: 20px;

    margin-top: 20px;

    border: 3px dashed #efc94b;
}

.question-number {
    font-weight: 800;

    color: #ef9f00;
}

.question {
    font-size: 20px;

    font-weight: 700;

    line-height: 1.5;

    margin: 8px 0 0;
}


/* WORD SEARCH */

.word-search-wrapper {
    display: flex;

    justify-content: center;

    margin-top: 25px;
}

.word-grid {
    display: grid;

    grid-template-columns: repeat(15, 1fr);

    gap: 4px;

    width: min(650px, 96vw);

    aspect-ratio: 1 / 1;

    background: #cfc8ee;

    padding: 7px;

    border-radius: 20px;

    user-select: none;

    touch-action: none;

    box-shadow:
        0 8px 0 #aaa1dc,
        0 15px 30px #5f568d30;
}

.cell {
    background: white;

    border-radius: 7px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: 800;

    font-size: clamp(10px, 2.6vw, 19px);

    color: #514a6e;

    cursor: pointer;

    transition: .12s;

    position: relative;
}

.cell:hover {
    background: #f2efff;

    transform: scale(1.08);

    z-index: 2;
}

.cell.selected {
    background: #ffd56f;

    color: #51431d;

    transform: scale(1.08);

    z-index: 3;
}

.cell.correct {
    background: #79dc9b;

    color: white;

    transform: scale(1.05);

    animation: correctPop .35s ease;
}

@keyframes correctPop {

    0% {
        transform: scale(.7);
    }

    70% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
    }

}


/* INSTRUCTION */

.instruction {
    text-align: center;

    margin-top: 20px;

    padding: 15px;

    background: #f1edff;

    border-radius: 18px;

    font-weight: 600;
}

.instruction span {
    color: #ed649f;
}


/* BUTTON */

.button-area {
    text-align: center;

    margin-top: 20px;
}

button {
    border: none;

    border-radius: 18px;

    padding: 13px 24px;

    font-family: inherit;

    font-weight: 800;

    color: white;

    background: #7467d6;

    box-shadow: 0 5px 0 #5148a9;

    cursor: pointer;

    margin: 5px;

    transition: .15s;
}

button:hover {
    transform: translateY(-3px);
}

button:active {
    transform: translateY(3px);

    box-shadow: 0 2px 0 #5148a9;
}

.reset-button {
    background: #ed679f;

    box-shadow: 0 5px 0 #b64b78;
}


/* FOUND WORD */

.found-word {
    text-align: center;

    margin-top: 20px;

    font-weight: 800;

    min-height: 30px;
}
